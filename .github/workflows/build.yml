name: Build Physical Snare VST3

on:
  push:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - uses: microsoft/setup-msbuild@v2

      - uses: lukka/get-cmake@latest

      - name: Configure
        run: cmake -B build -S . -A x64

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Package VST3
        shell: pwsh
        run: |
          $plugin = Get-ChildItem build -Recurse -Directory -Filter "*.vst3" |
            Where-Object { $_.Name -eq "Physical Snare.vst3" -or $_.Name -eq "PhysicalSnare.vst3" } |
            Select-Object -First 1
          if (-not $plugin) {
            Get-ChildItem build -Recurse -Directory | Where-Object { $_.Name -like "*.vst3" }
            throw "VST3 bundle not found"
          }
          Compress-Archive -Path $plugin.FullName -DestinationPath PhysicalSnare-VST3-Windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: PhysicalSnare-VST3-Windows
          path: PhysicalSnare-VST3-Windows.zip
